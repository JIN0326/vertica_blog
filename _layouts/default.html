<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <div class="page-shell">
      {% include header.html %}

      <div class="layout-inner">
        {% include sidebar.html %}

        <main class="site-content">
          {{ content }}
        </main>
      </div>

      {% include footer.html %}
    </div>

    <div id="search-overlay" class="search-overlay" style="display: none;">
      <div class="search-overlay-content">
        <button id="close-search-btn" class="close-search-btn" aria-label="Close search">&times;</button>
        <h3>Search Blog</h3>
        <input type="text" id="search-input" placeholder="Search for content..." autocomplete="off">
        <ul id="search-results"></ul>
      </div>
    </div>

    <script>
      (function() {
        const searchBtn = document.getElementById('search-btn');
        const closeSearchBtn = document.getElementById('close-search-btn');
        const searchOverlay = document.getElementById('search-overlay');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let searchData = [];
        let dataPromise = null;

        function loadSearchData() {
          if (!dataPromise) {
            dataPromise = fetch('{{ "/search.json" | relative_url }}')
              .then(response => {
                if (!response.ok) throw new Error('Search data not found.');
                return response.json();
              })
              .then(data => {
                searchData = data;
                return data;
              }).catch(error => console.error("Error loading search data:", error));
          }
          return dataPromise;
        }

        function openSearch() {
          loadSearchData();
          searchOverlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          searchInput.focus();
        }

        function closeSearch() {
          searchOverlay.style.display = 'none';
          document.body.style.overflow = '';
          searchInput.value = '';
          searchResults.innerHTML = '';
        }

        async function performSearch() {
          await loadSearchData();

          const query = searchInput.value.toLowerCase().trim();
          searchResults.innerHTML = '';
          if (query.length < 2) return;

          const results = searchData.filter(item =>
            item.title.toLowerCase().includes(query) ||
            (item.content && item.content.toLowerCase().includes(query))
          );

          if (results.length > 0) {
            results.slice(0, 10).forEach(result => { // Show top 10 results
              const li = document.createElement('li');

              let snippet = '';
              const content = result.content;
              if (content) {
                const queryIndex = content.toLowerCase().indexOf(query);
                if (queryIndex > -1) {
                  const startIndex = Math.max(0, queryIndex - 40);
                  const endIndex = Math.min(content.length, queryIndex + query.length + 80);
                  snippet = content.substring(startIndex, endIndex);
                  
                  if (startIndex > 0) snippet = '...' + snippet;
                  if (endIndex < content.length) snippet = snippet + '...';
                  
                  snippet = snippet.replace(new RegExp(query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'gi'), (match) => `<mark>${match}</mark>`);
                }
              }

              li.innerHTML = `
                <a href="${result.url}">
                  <span class="search-result-title">${result.title}</span>
                  ${snippet ? `<p class="search-result-snippet">${snippet}</p>` : ''}
                </a>`;
              searchResults.appendChild(li);
            });
          } else {
            searchResults.innerHTML = '<li>No results found.</li>';
          }
        }

        searchBtn.addEventListener('click', openSearch);
        closeSearchBtn.addEventListener('click', closeSearch);
        searchOverlay.addEventListener('click', (e) => {
          if (e.target === searchOverlay) closeSearch();
        });
        searchInput.addEventListener('input', performSearch);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && searchOverlay.style.display === 'flex') closeSearch();
        });
      })();
    </script>
  </body>
</html>
